services:

  # ── ClickHouse (syslog log storage) ────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: pktlog-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: pktlog
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── pktLog application ─────────────────────────────────────────────────────
  pktlog:
    image: ghcr.io/bsnwgit/pktlog:latest
    container_name: pktlog
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:${APP_HTTP_PORT:-80}"
      - "${APP_HTTPS_PORT:-443}:${APP_HTTPS_PORT:-443}"
      - "${APP_SYSLOG_PORT:-514}:${APP_SYSLOG_PORT:-514}/udp"
      - "${APP_SYSLOG_PORT:-514}:${APP_SYSLOG_PORT:-514}/tcp"
    environment:
      APP_ADMIN_USER: "${APP_ADMIN_USER:-admin}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is required}"
      APP_JWT_SECRET: "${APP_JWT_SECRET:-}"
      APP_HTTP_PORT: "${APP_HTTP_PORT:-80}"
      APP_HTTPS_PORT: "${APP_HTTPS_PORT:-443}"
      APP_SYSLOG_PORT: "${APP_SYSLOG_PORT:-514}"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: "pktlog"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - pktlog_data:/app/data

volumes:
  pktlog_data:
  clickhouse_data:
