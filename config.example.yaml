# pktLog configuration
# Copy to /opt/pktlog/config.yaml (or wherever PKTLOG_INSTALL_DIR points),
# or set PKTLOG_CONFIG=/path/to/config.yaml, then restart the service.
#
# install.sh generates config.yaml from this file automatically and fills
# in secret_key and the install directory — edit config.yaml afterwards for
# any further changes.
#
# Most runtime settings (storage backend, retention, notifications, etc.) are
# managed via the Settings page in the UI and stored in SQLite.
# This file only covers infrastructure/startup settings.

# ── Server ────────────────────────────────────────────────────────────────────
host: "0.0.0.0"
port: 8768
workers: 2
debug: false

# ── SQLite app database ────────────────────────────────────────────────────────
db_path: "/opt/pktlog/pktlog.db"

# ── ClickHouse ────────────────────────────────────────────────────────────────
# Use the IP/hostname of your ClickHouse instance ("localhost" if installed
# on the same host by install.sh).
clickhouse_host: "localhost"
clickhouse_port: 9000
clickhouse_database: "pktlog"
clickhouse_user: "default"
clickhouse_password: ""

# ── Syslog ingest port ────────────────────────────────────────────────────────
syslog_port: 8761

# ── DuckDB (only if using DuckDB backend instead of ClickHouse) ───────────────
duckdb_path: "/opt/pktlog/pktlog_data.duckdb"

# ── JWT (generate with: openssl rand -hex 32) ─────────────────────────────────
secret_key: "CHANGE_ME_generate_with_openssl_rand_hex_32"

# ── CORS (restrict to your actual origin in production) ──────────────────────
cors_origins:
  - "*"

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: "info"
log_file: "/opt/pktlog/logs/pktlog.log"
