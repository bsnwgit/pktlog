# pktLog configuration
# Copy to config.yaml alongside the app, or set PKTLOG_CONFIG=/path/to/config.yaml
#
# Docker: this file is auto-generated by docker-entrypoint.sh — edit env vars instead.
# Bare-metal: copy to /path/to/pktlog/config.yaml and restart the service.
#
# Most runtime settings (storage backend, retention, notifications, etc.) are
# managed via the Settings page in the UI and stored in SQLite.
# This file only covers infrastructure/startup settings.

# ── Server ────────────────────────────────────────────────────────────────────
host: "0.0.0.0"
port: 443
workers: 2
debug: false

# ── SQLite app database ────────────────────────────────────────────────────────
# Docker default:      /app/data/pktlog.db
# Bare-metal default:  /opt/pktlog/pktlog.db
db_path: "/app/data/pktlog.db"

# ── ClickHouse ────────────────────────────────────────────────────────────────
# Docker: "clickhouse" resolves to the bundled ClickHouse container.
# Bare-metal: use the IP/hostname of your ClickHouse instance.
clickhouse_host: "clickhouse"
clickhouse_port: 9000
clickhouse_database: "pktlog"
clickhouse_user: "default"
clickhouse_password: ""

# ── Syslog ingest port ────────────────────────────────────────────────────────
# Docker default: 514 (standard syslog)
# Bare-metal default: 514
syslog_port: 514

# ── DuckDB (only if using DuckDB backend instead of ClickHouse) ───────────────
duckdb_path: "/app/data/pktlog_data.duckdb"

# ── JWT (generate with: openssl rand -hex 32) ─────────────────────────────────
secret_key: "CHANGE_ME_generate_with_openssl_rand_hex_32"

# ── CORS (restrict to your actual origin in production) ──────────────────────
cors_origins:
  - "*"

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: "info"
log_file: "/app/data/logs/pktlog.log"
